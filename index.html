<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc nhỏ nhà Chanh</title>
    <style>
        /* --- CẤU HÌNH CHUNG & NỀN CARO HỒNG --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fff0f5;
            background-image: linear-gradient(90deg, rgba(255,182,193,0.15) 50%, transparent 50%),
                              linear-gradient(rgba(255,182,193,0.15) 50%, transparent 50%);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* --- KHUNG ĐIỆN THOẠI (CONTAINER) --- */
        .phone-container {
            width: 100%;
            max-width: 412px;
            background: #ffffff;
            border: 4px dashed #ff69b4;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            overflow: hidden;
            position: relative;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        /* --- TRANG 1: MÀN HÌNH CHÀO (WELCOME) --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
        }

        /* Khung Avatar có thể đổi ảnh */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px dashed #ff6b8b;
            padding: 5px;
            background: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .avatar-container:hover {
            transform: scale(1.05);
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #e0e0e0;
        }
        .avatar-hint {
            position: absolute;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 10px;
            width: 100%;
            padding: 2px 0;
            border-bottom-left-radius: 75px;
            border-bottom-right-radius: 75px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .avatar-container:hover .avatar-hint {
            opacity: 1;
        }
        #avatar-input {
            display: none;
        }

        .decor-text {
            color: #ff6b8b;
            font-size: 14px;
            margin: 15px 0 5px 0;
        }

        h1.title {
            color: #ff6b8b;
            font-size: 32px;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ff6b8b;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* Khung Thơ / Trích dẫn */
        .quote-box {
            border: 2px dashed #ffb6c1;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fff9fa;
            width: 100%;
        }
        .quote-box p {
            color: #8b5a6c;
            font-style: italic;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Khung Nhạc BGM */
        .bgm-box {
            border: 2px dashed #ffb6c1;
            border-radius: 15px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 25px;
            background: #fff;
        }
        .bgm-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ff6b8b;
            font-size: 13px;
            font-weight: bold;
        }
        .bgm-icon {
            background: #ffe4e1;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ff6b8b;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        /* Nút Vào Hậu Cung chính */
        .btn-main {
            background: #ff6b8b;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 107, 139, 0.3);
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-main:hover {
            background: #ff4f73;
            transform: translateY(-2px);
        }

        /* Các nút MXH phía dưới */
        .social-footer {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }
        .btn-sub {
            background: #fff;
            border: 2px solid #ffe4e1;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 12px;
            color: #ff6b8b;
            font-weight: bold;
            text-decoration: none;
            flex: 1;
            text-align: center;
        }

        /* --- TRANG 2: MAN HÌNH HẬU CUNG (DANH SÁCH) --- */
        #harem-screen {
            display: none; /* Ẩn mặc định */
            flex-direction: column;
            padding: 20px 15px;
            max-height: 85vh;
            overflow-y: auto; /* Cho phép cuộn xuống */
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn-back {
            background: #fff;
            border: 2px dashed #ff6b8b;
            color: #ff6b8b;
            padding: 6px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .status-box {
            border: 2px dashed #ffb6c1;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            color: #ff6b8b;
            font-weight: bold;
            font-size: 14px;
            background: #fff9fa;
            margin-bottom: 15px;
        }

        /* Form để bạn tự thêm nhân vật của mình */
        .add-character-box {
            border: 2px solid #ffe4e1;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            background: #fff;
        }
        .add-character-box h3 {
            color: #ff6b8b;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }
        .add-character-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ffb6c1;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }
        .btn-add-char {
            width: 100%;
            background: #ff6b8b;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Khung của từng nhân vật được thêm vào */
        .char-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .char-card {
            border: 2px dashed #ffb6c1;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            background: #fff;
            position: relative;
        }
        .char-name {
            color: #c71585;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .tag {
            background: #fff0f5;
            border: 1px dashed #ff6b8b;
            color: #ff6b8b;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .char-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-action-main {
            background: #ff6b8b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-action-row {
            display: flex;
            gap: 8px;
        }
        .btn-action-sub {
            flex: 1;
            background: #fff;
            border: 1px solid #ffb6c1;
            color: #ff6b8b;
            padding: 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .like-box {
            border: 1px solid #ffe4e1;
            padding: 6px;
            border-radius: 15px;
            margin-top: 8px;
            color: #ff6b8b;
            font-size: 12px;
        }
        
        /* Nút xóa nhân vật nếu muốn gỡ bỏ */
        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-delete:hover {
            color: red;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div id="welcome-screen">
            <div class="avatar-container" onclick="triggerAvatarUpload()">
                <img id="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23ccc'/><text x='50%' y='55%' font-size='12' fill='%23666' font-family='sans-serif' text-anchor='middle'>Bấm đổi ảnh</text></svg>" alt="Avatar">
                <div class="avatar-hint">Thay đổi ảnh</div>
            </div>
            <input type="file" id="avatar-input" accept="image/*" onchange="loadAvatar(event)">

            <div class="decor-text">★ ﾟ･*:.｡. ♡ .｡.:*･ﾟ ★</div>
            <h1 class="title">Welcome my<br>Little Lemons</h1>
            <div class="subtitle">——Góc nhỏ nhà Chanh ——</div>

            <div class="quote-box">
                <p>"Hồng đậu sinh nam quốc<br>
                Xuân lai phát kỷ chi.<br>
                Nguyện quân đa thái hiết,<br>
                Thử vật tối tương tư.</p>
            </div>

            <div class="bgm-box">
                <div class="bgm-info">
                    <div class="bgm-icon">🎵</div>
                    <span>BGM: Playlists Chanh nhỏ</span>
                </div>
                <button class="play-btn">▶</button>
            </div>

            <button class="btn-main" onclick="switchScreen('harem')">Dạo vườn nhỏ ✨</button>

            <div class="social-footer">
                <a href="#" class="btn-sub">📜 TOS</a>
                <a href="#" class="btn-sub">💬 Discord</a>
                <a href="#" class="btn-sub">👥 Facebook</a>
            </div>
        </div>

        <div id="harem-screen">
            <div class="top-bar">
                <button class="btn-back" onclick="switchScreen('welcome')">← Trở về</button>
                <div style="color: #ff6b8b; font-weight: bold;">🌸 Hoa Đào May Mắn</div>
            </div>

            <div class="status-box">
                : <span id="char-count">0</span> nhân vật
            </div>

            <div class="add-character-box">
                <h3>+ Thêm chanh nhỏ vào vườn</h3>
                <input type="text" id="new-name" placeholder="Nhập tên nhân vật...">
                <input type="text" id="new-tags" placeholder="Nhập các tag (cách nhau bằng dấu phẩy)... VD: #ViệtNam, #Ngọt">
                <input type="text" id="new-link" placeholder="Dán Link AI (nếu có)...">
                <button class="btn-add-char" onclick="addNewCharacter()">Thêm Vào Vườn Chanh</button>
            </div>

            <div class="char-list" id="character-container">
                </div>
        </div>

    </div>

    <script>
        // Chuyển đổi qua lại giữa màn hình chào và màn hình vườn chanh
        function switchScreen(screen) {
            const welcome = document.getElementById('welcome-screen');
            const harem = document.getElementById('harem-screen');
            
            if (screen === 'harem') {
                welcome.style.display = 'none';
                harem.style.display = 'flex';
            } else {
                welcome.style.display = 'flex';
                harem.style.display = 'none';
            }
        }

        // Kích hoạt ô chọn file ảnh khi bấm vào hình tròn đại diện
        function triggerAvatarUpload() {
            document.getElementById('avatar-input').click();
        }

        // Đọc ảnh từ thiết bị và đặt làm ảnh Avatar tròn
        function loadAvatar(event) {
            const output = document.getElementById('avatar-preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            output.onload = function() {
                URL.revokeObjectURL(output.src); // Giải phóng bộ nhớ
            }
        }

        // Mảng lưu trữ danh sách nhân vật tự thêm
        let characters = [];

        // Hàm cập nhật đếm số lượng nhân vật hiển thị trên giao diện
        function updateCount() {
            document.getElementById('char-count').innerText = characters.length;
        }

        // Hàm thêm nhân vật mới từ Form vào danh sách
        function addNewCharacter() {
            const nameInput = document.getElementById('new-name');
            const tagsInput = document.getElementById('new-tags');
            const linkInput = document.getElementById('new-link');

            if (!nameInput.value.trim()) {
                alert("Vui lòng nhập tên nhân vật nha!");
                return;
            }

            // Xử lý cắt chuỗi tag dựa trên dấu phẩy
            const rawTags = tagsInput.value.split(',');
            const processedTags = rawTags.map(tag => tag.trim()).filter(tag => tag.length > 0);

            // Tạo đối tượng nhân vật mới
            const newChar = {
                id: Date.now(),
                name: nameInput.value.trim(),
                tags: processedTags.length > 0 ? processedTags : ["#ChưaPhânLoại"],
                link: linkInput.value.trim() || "#",
                likes: 0
            };

            // Đưa vào mảng dữ liệu và render ra màn hình
            characters.push(newChar);
            renderCharacters();

            // Xóa sạch dữ liệu trong form sau khi thêm xong để tiện nhập tiếp
            nameInput.value = "";
            tagsInput.value = "";
            linkInput.value = "";
        }

        // Hàm xóa nhân vật khỏi danh sách
        function deleteCharacter(id) {
            characters = characters.filter(char => char.id !== id);
            renderCharacters();
        }

        // Hàm tăng lượt thích (Tim) cho nhân vật
        function likeCharacter(id) {
            const char = characters.find(c => c.id === id);
            if (char) {
                char.likes += 1;
                renderCharacters();
            }
        }

        // Hàm dựng cấu trúc HTML hiển thị danh sách nhân vật
        function renderCharacters() {
            const container = document.getElementById('character-container');
            container.innerHTML = ""; // Xóa danh sách cũ đi để dựng lại

            if (characters.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#aaa; font-size:13px; margin-top:20px;">Hậu cung trống trải quá, hãy thêm nhân vật đầu tiên nhé!</p>`;
                updateCount();
                return;
            }

            characters.forEach(char => {
                // Tạo các cụm tag HTML nhỏ gọn
                let tagsHTML = char.tags.map(t => `<span class="tag">${t.startsWith('#') ? t : '#' + t}</span>`).join('');

                // Giao diện chuẩn cho mỗi khung thẻ nhân vật
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerHTML = `
                    <button class="btn-delete" onclick="deleteCharacter(${char.id})">×</button>
                    <div class="char-name">${char.name}</div>
                    <div class="tag-container">
                        ${tagsHTML}
                    </div>
                    <div class="char-actions">
                        <a href="${char.link}" target="_blank" class="btn-action-main">Link AI</a>
                        <div class="btn-action-row">
                            <button class="btn-action-sub">Background</button>
                            <button class="btn-action-sub">📋 Lệnh</button>
                        </div>
                    </div>
                    <div class="like-box" style="cursor:pointer;" onclick="likeCharacter(${char.id})">
                        ❤️ ${char.likes} lượt thích
                    </div>
                `;
                container.appendChild(card);
            });

            updateCount();
        }
    </script>
</body>
</html>
